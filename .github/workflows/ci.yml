name: Test and security checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      AUDIT_SECRET_KEY: ci-only-nonproduction-unit-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile Python modules
        run: python -m compileall -q primer_designer.py cli.py simulator.py enrichment.py agents tests
      - name: Run tests
        run: python -m pytest -q
      - name: Validate browser JavaScript syntax
        run: node --check web/app.js
      - name: Check runtime audit HMAC verification
        run: python -c "from agents.base import AuditLogger; assert AuditLogger.verify_integrity()"
